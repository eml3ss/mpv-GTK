[423]
source=Применяет именованный профиль настроек или восстанавливает предыдущие значения.
translation=Applies a named settings profile or restores its previous values.

[424]
source=Читает параметры из дополнительного конфигурационного файла.
translation=Reads options from an additional configuration file.

[425]
source=Добавляет привязки из файла input.conf к работающему экземпляру mpv.
translation=Adds bindings from an input.conf file to the running mpv instance.

[426]
source=Загружает и запускает указанный скрипт mpv.
translation=Loads and starts the specified mpv script.

[427]
source=Записывает указанный временной участок демультиплексированного кэша в файл.
translation=Writes a time range of the demuxer cache to a file.

[428]
source=Записывает участок кэша между текущими точками A и B в файл.
translation=Writes the cached segment between the current A and B points to a file.

[429]
source=Подгоняет точки A и B к границам кадров, доступным для выгрузки кэша.
translation=Aligns A and B points to cached frame boundaries for cache dumping.

[430]
source=Запрашивает перетаскивание окна видеовывода при удерживаемой кнопке мыши.
translation=Requests video-output window dragging while a mouse button is held.

[431]
source=Запрашивает контекстное меню видеовывода, если оно поддерживается.
translation=Requests the video output's context menu when supported.

[432]
source=Завершает или очищает строку статуса в терминале.
translation=Finishes or clears the terminal status line.

[433]
source=Уведомляет наблюдающих клиентов о возможном изменении свойства.
translation=Notifies observing clients that a property may have changed.

[434]
source=Встроенный видеовывод поддерживает OpenGL и OpenGL ES.
translation=Embedded video output supports OpenGL and OpenGL ES.

