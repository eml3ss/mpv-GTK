[PlaylistOffDescription]
source=Открывает только выбранный файл, не добавляя соседние файлы.
translation=Opens only the selected file, without adding nearby files.

[PlaylistApplyDescription]
source=Изменения применяются при следующем открытии файла или папки. Перезапуск не нужен; текущая очередь не меняется.
translation=Changes apply the next time you open a file or folder. No restart is needed; the current queue stays unchanged.

[PlaylistFilterDescription]
source=При открытии файла добавляет соседние файлы категорий, перечисленных ниже.
translation=When opening a file, adds nearby files from the categories listed below.

[PlaylistSameDescription]
source=При открытии файла добавляет соседние файлы того же типа.
translation=When opening a file, adds nearby files of the same media type.

[DirectoryAutoDescription]
source=Раскрывает подпапки по мере перехода; при случайном порядке заранее включает всё дерево.
translation=Opens subfolders when reached; with shuffle enabled, includes the whole tree in advance.

[DirectoryLazyDescription]
source=Подпапки раскрываются только при переходе к ним.
translation=Subfolders are opened only when playback reaches them.

[DirectoryRecursiveDescription]
source=Сразу включает файлы из всех вложенных папок.
translation=Includes files from all subfolders immediately.

[DirectoryIgnoreDescription]
source=Не включает вложенные папки.
translation=Skips subfolders.

