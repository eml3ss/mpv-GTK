translation=Comma-separated categories: video, audio, image, archive, playlist. An empty field includes all files.

[PlaylistExtensions]
source=Расширения файлов
translation=File extensions

[OpeningAllowReplace]
source=Разрешать замену файла
translation=Allow replace

[OpeningAllowReplaceDescription]
source=При открытии и перетаскивании разрешает заменить текущий файл. Если оба режима выключены, открытый файл сохраняется.
translation=Allows opening and dropping files to replace the current file. With both modes off, the current file is kept.

[OpeningAddQueue]
source=Добавлять файлы в очередь
translation=Add video to queue

[OpeningAddQueueDescription]
source=Добавляет открытые или перетащенные файлы в очередь; имеет приоритет над заменой. Пустой плеер всегда начинает воспроизведение.
translation=Adds opened or dropped files to the queue and takes priority over replacement. An empty player always starts playback.

